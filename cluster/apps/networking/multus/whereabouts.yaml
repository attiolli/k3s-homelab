---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ippools.whereabouts.cni.cncf.io
spec:
  group: whereabouts.cni.cncf.io
  scope: Cluster
  names:
    plural: ippools
    singular: ippool
    kind: IPPool
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - range
                - allocations
              properties:
                range:
                  type: string
                allocations:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      id:
                        type: string
                      podref:
                        type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: overlappingrangeipreservations.whereabouts.cni.cncf.io
spec:
  group: whereabouts.cni.cncf.io
  scope: Cluster
  names:
    plural: overlappingrangeipreservations
    singular: overlappingrangeipreservation
    kind: OverlappingRangeIPReservation
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - podref
              properties:
                podref:
                  type: string
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whereabouts
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: whereabouts
rules:
  - apiGroups: ["whereabouts.cni.cncf.io"]
    resources: ["ippools", "overlappingrangeipreservations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: whereabouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: whereabouts
subjects:
  - kind: ServiceAccount
    name: whereabouts
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whereabouts
  namespace: kube-system
  labels:
    app: whereabouts
spec:
  selector:
    matchLabels:
      app: whereabouts
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: whereabouts
    spec:
      hostNetwork: true
      serviceAccountName: whereabouts
      tolerations:
        - operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-whereabouts
          image: ghcr.io/k8snetworkplumbingwg/whereabouts:latest
          command:
            - /bin/sh
            - -c
            - |
              cp /usr/src/whereabouts/bin/whereabouts /host/opt/cni/bin/
              echo "Whereabouts binary installed"
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
      containers:
        - name: whereabouts
          image: ghcr.io/k8snetworkplumbingwg/whereabouts:latest
          command:
            - /usr/src/whereabouts/bin/whereabouts
          env:
            - name: WHEREABOUTS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "10m"
              memory: "30Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d