---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    plural: network-attachment-definitions
    singular: network-attachment-definition
    kind: NetworkAttachmentDefinition
    shortNames:
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: NetworkAttachmentDefinition is a CRD schema specified by the Network Plumbing Working Group
          type: object
          properties:
            spec:
              type: object
              properties:
                config:
                  type: string
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multus
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multus
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "update"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multus
subjects:
  - kind: ServiceAccount
    name: multus
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multus-cni-config
  namespace: kube-system
data:
  daemon-config.json: |
    {
      "confDir": "/host/etc/cni/net.d",
      "binDir": "/host/opt/cni/bin",
      "kubeconfig": "/host/etc/cni/net.d/multus.d/multus.kubeconfig",
      "multusAutoconfigDir": "/host/etc/cni/net.d",
      "multusConfigFile": "auto",
      "namespaceIsolation": false,
      "globalNamespaces": "default,kube-system,voip",
      "logLevel": "debug"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
  labels:
    tier: node
    app: multus
    name: multus
spec:
  selector:
    matchLabels:
      name: multus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        tier: node
        app: multus
        name: multus
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
      serviceAccountName: multus
      initContainers:
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:stable-thick
          command:
            - /bin/sh
            - -c
            - |
              # Copy multus binary
              cp /usr/src/multus-cni/bin/multus /host/opt/cni/bin/
              cp /usr/src/multus-cni/bin/multus-daemon /host/opt/cni/bin/
              # Symlink k3s cni multicall binary for macvlan etc
              for plugin in macvlan ipvlan bridge host-local static flannel portmap bandwidth; do
                if [ ! -f /host/opt/cni/bin/$plugin ]; then
                  ln -sf /var/lib/rancher/k3s/data/current/bin/cni /host/opt/cni/bin/$plugin
                fi
              done
              # Create multus.d dir for kubeconfig
              mkdir -p /host/etc/cni/net.d/multus.d
              echo "Multus binary installed successfully"
          resources:
            requests:
              cpu: "10m"
              memory: "15Mi"
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
        - name: install-config
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /host/etc/cni/net.d/multus.d
              cp /tmp/multus-conf/daemon-config.json /host/etc/cni/net.d/multus.d/daemon-config.json
              echo "Config installed"
          volumeMounts:
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
            - name: multus-cfg
              mountPath: /tmp/multus-conf
      containers:
        - name: kube-multus
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:stable-thick
          command:
            - /usr/src/multus-cni/bin/multus-daemon
          args:
            - -config=/host/etc/cni/net.d/multus.d/daemon-config.json
          resources:
            requests:
              cpu: "10m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-conf
              mountPath: /host/etc/cni/net.d
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: host-run
              mountPath: /host/run
            - name: host-var-lib-cni
              mountPath: /var/lib/cni
            - name: multus-cfg
              mountPath: /tmp/multus-conf
      volumes:
        - name: cni-conf
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: /run
        - name: host-var-lib-cni
          hostPath:
            path: /var/lib/cni
            type: DirectoryOrCreate
        - name: multus-cfg
          configMap:
            name: multus-cni-config
            items:
              - key: daemon-config.json
                path: daemon-config.json